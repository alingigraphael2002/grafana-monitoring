services:

  nestjs-observability-demo:
    build:
      context: ./nestjs-observability-demo
    container_name: nestjs-observability-demo
    ports:
      - "3001:3000"
    environment:
      - OTEL_SERVICE_NAME=nestjs-observability-demo
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development,service.version=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    depends_on:
      - alloy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

    networks:
      - grafana-monitoring

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana-monitoring-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - grafana-monitoring


  loki:
    image: grafana/loki:3.6.14
    container_name: grafana-monitoring-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/var/loki
    command:
      - -config.file=/etc/loki/config.yaml
    depends_on:
      loki-volume-init:
        condition: service_completed_successfully
    networks:
      - grafana-monitoring

  loki-volume-init:
    image: node:22-alpine
    container_name: grafana-monitoring-loki-volume-init
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - chown -R 10001:10001 /var/loki
    volumes:
      - loki-data:/var/loki
    restart: "no"


  mimir:
    image: grafana/mimir:3.1.1
    container_name: grafana-monitoring-mimir
    ports:
      - "9009:9009"
    volumes:
      - ./mimir/mimir-config.yaml:/etc/mimir/config.yaml
      - mimir-data:/var/mimir
    command:
      - -target=all
      - -config.file=/etc/mimir/config.yaml
    networks:
      - grafana-monitoring

  tempo:
    image: grafana/tempo:3.0.2
    container_name: grafana-monitoring-tempo
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    command:
      - -config.file=/etc/tempo/config.yaml
    networks:
      - grafana-monitoring




  alloy:
    image: grafana/alloy:v1.16.3
    container_name: grafana-monitoring-alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki
      - mimir
      - tempo
    networks:
      - grafana-monitoring

  postgres:
    image: postgres:16
    container_name: grafana-monitoring-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: citus
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d citus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grafana-monitoring

networks:
  grafana-monitoring:
    name: grafana-monitoring


volumes:
  grafana-storage:
  loki-data:
  mimir-data:
  tempo-data:
  postgres-data:
